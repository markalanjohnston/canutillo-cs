<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Here · Computer Science at CHS</title>
<link rel="icon" href="data:,">
<!--
  Loop 1, for kids: Computer Science at CHS (Canutillo High School), CTE Night.
  A full-screen kiosk loop. Open it once, go full screen, and leave it alone.

  Offline by design: system fonts, relative paths, no external requests. Every image is loaded and
  decoded once, before the loop starts. After that the page fetches nothing and never reloads itself.

  URL options:
    ?preview=N   slide N (1-15) in its finished state, with no timers (for screenshots and review)
    ?start=N     start the loop at slide N
    ?reload=M    reload between cycles once M minutes have passed (off unless asked for)
-->
<style>
  :root {
    --u: min(1vw, 1.7778vh);          /* one unit = 1% of a 16:9 screen's width */
    --cyan: #00d9ff;
    --magenta: #ff006e;
    --pink: #ff7afc;
    --lime: #b6ff70;
    --gold: #ffd166;
    --es: #ffad4a;                     /* every Spanish line */
    --orange: #F08000;                 /* CS eagle orange */
    --navy: #001080;                   /* CS eagle navy */
    --head: 'Arial Black', 'DejaVu Sans', 'Helvetica Neue', Roboto, 'Segoe UI', Arial, sans-serif;
    --text: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
    --mono: Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', 'Roboto Mono', 'Liberation Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: var(--text);
    cursor: none;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /* ─── stage ───────────────────────────────── */
  .stage {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 18% 45%, rgba(0, 16, 128, 0.34), rgba(0, 0, 0, 0) 70%),
      #000;
  }

  /* Art layers: one per image, built once and kept. Each crossfades in with its own glow,
     so a slide still looks finished on the dark ground if its picture never loads. */
  .arts { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; }
  .art {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .art.active { opacity: 1; }
  .art .glow {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background:
      radial-gradient(ellipse 46% 62% at 72% 46%, rgba(var(--g), 0.34), rgba(var(--g), 0) 72%),
      radial-gradient(ellipse 40% 50% at 8% 92%, rgba(var(--g), 0.12), rgba(var(--g), 0) 70%);
  }
  /* The portrait sits on the right and fades in from the left, so faces stay clear of the text. */
  .art .pic {
    position: absolute;
    top: 0; right: 0;
    width: 58vw;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 16%, #000 34%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 16%, #000 34%);
    transform: scale(1.06);
    transform-origin: 65% 40%;
    transition: transform 14s linear;
  }
  .art.active .pic { transform: scale(1); }
  .art .failed { display: none !important; }
  /* The eagle logo: cropped to its artwork (the file has clear space above and below), never stretched. */
  .art.emblem .crop {
    position: absolute;
    right: 6vw;
    top: 50%;
    width: 32vw;
    height: calc(32vw * 0.4273);
    margin-top: calc(32vw * -0.21365);
    overflow: hidden;
    transform: scale(1.04);
    transition: transform 14s linear;
  }
  .art.emblem.active .crop { transform: scale(1); }
  .art.emblem .crop .pic {
    position: static;
    display: block;
    width: 101.99%;
    height: auto;
    margin-left: -0.896%;
    margin-top: -31.08%;
    -webkit-mask-image: none;
    mask-image: none;
    transform: none;
    transition: none;
  }

  /* Darkening so text reads on any picture */
  .vignette {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 26% 16% at 90% 0%, rgba(0,0,0,0.72), rgba(0,0,0,0) 100%),
      linear-gradient(to right, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.5) 36%, rgba(0,0,0,0) 62%),
      linear-gradient(to bottom, rgba(0,0,0,0.66) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 76%, rgba(0,0,0,0.8) 100%);
  }

  /* Subtle CRT scanlines */
  .scanlines {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 255, 0.025) 0px,
      rgba(0, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 4;
    mix-blend-mode: overlay;
  }

  /* Animated grid floor */
  .grid-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35vh;
    background-image:
      linear-gradient(rgba(255, 0, 110, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 217, 255, 0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(400px) rotateX(60deg);
    transform-origin: bottom center;
    animation: grid-scroll 6s linear infinite;
    opacity: 0.35;
    pointer-events: none;
    z-index: 2;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent 100%);
    mask-image: linear-gradient(to top, #000 30%, transparent 100%);
  }
  @keyframes grid-scroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 60px, 0 0; }
  }

  /* ─── HUD ─────────────────────────────────── */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--u) * 1.25) calc(var(--u) * 2.4);
    font-family: var(--mono);
    font-size: calc(var(--u) * 0.95);
    letter-spacing: calc(var(--u) * 0.22);
    color: rgba(255, 255, 255, 0.78);
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 0 14px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }
  .hud .brand { display: flex; align-items: center; }
  .hud .brand strong { color: #fff; font-weight: 800; }
  .hud .logo {
    display: block;
    flex: none;
    width: calc(var(--u) * 5.6);
    height: calc(var(--u) * 5.6 * 0.4273);
    overflow: hidden;
    margin-right: calc(var(--u) * 1.1);
  }
  .hud .logo img {
    display: block;
    width: 101.99%;
    margin-left: -0.896%;
    margin-top: -31.08%;
  }
  .hud .logo.failed { display: none; }
  .hud .right { display: flex; align-items: center; }
  .hud .right > * { margin-left: calc(var(--u) * 1.2); }
  .hud .clock { color: var(--cyan); }
  .hud .dot {
    width: calc(var(--u) * 0.45);
    height: calc(var(--u) * 0.45);
    border-radius: 50%;
    background: var(--magenta);
    box-shadow: 0 0 calc(var(--u) * 0.6) var(--magenta);
    animation: blink 2s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  /* ─── content ─────────────────────────────── */
  .content {
    position: absolute;
    left: calc(var(--u) * 5);
    top: 50%;
    width: calc(var(--u) * 54);
    transform: translateY(-50%);
    z-index: 5;
    --s: 1;    /* whole-slide fit, set per slide by fit() */
    --hs: 1;   /* extra headline fit, for one very long word */
  }
  .rv {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .rv.in { opacity: 1; transform: none; }

  .eyebrow {
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 1.2 * var(--s));
    letter-spacing: calc(var(--u) * 0.3);
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(0, 217, 255, 0.5);
    margin-bottom: calc(var(--u) * 1.1 * var(--s));
    white-space: nowrap;
    min-height: 1.25em;
  }

  .headline {
    --hsz: 6.4;
    font-family: var(--head);
    font-weight: 900;
    font-size: calc(var(--u) * var(--hsz) * var(--s) * var(--hs));
    line-height: 0.95;
    letter-spacing: -0.015em;
    color: #fff;
    text-shadow:
      -0.035em 0 0 rgba(255, 0, 60, 0.92),
       0.035em 0 0 rgba(0, 217, 255, 0.92),
       0 0 0.3em rgba(255, 255, 255, 0.22);
    transform: translateY(30px) scale(0.98);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: calc(var(--u) * 1.3 * var(--s));
  }
  .headline.xl { --hsz: 7.6; }
  .headline.l  { --hsz: 6.4; }
  .headline.m  { --hsz: 5.3; }
  .headline.s  { --hsz: 4.5; }
  .headline .ln { display: block; text-wrap: balance; }
  .headline .ln.accent {
    color: #33e6ff;
    text-shadow: -0.035em 0 0 rgba(255, 0, 110, 0.9), 0 0 0.3em rgba(0, 217, 255, 0.4);
  }
  .headline .ln.small {
    font-size: 0.42em;
    line-height: 1.25;
    letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 0 0.4em rgba(0, 0, 0, 0.8);
    margin-bottom: 0.2em;
  }
  .headline.in { opacity: 1; transform: none; }
  .headline.in .ln { animation: glitch-in 0.55s linear 1; }
  @keyframes glitch-in {
    0%   { transform: translateX(-0.05em) skewX(-8deg);
           text-shadow: -0.1em 0 0 rgba(255,0,60,0.95), 0.1em 0 0 rgba(0,217,255,0.95); }
    25%  { transform: translateX(0.04em);
           text-shadow: 0.07em 0 0 rgba(255,0,60,0.95), -0.07em 0 0 rgba(0,217,255,0.95); }
    50%  { transform: translateX(-0.02em) skewX(4deg);
           text-shadow: -0.05em 0 0 rgba(255,0,60,0.95), 0.05em 0 0 rgba(0,217,255,0.95); }
    75%  { transform: translateX(0.01em); }
    100% { transform: none; }
  }

  .sub {
    text-wrap: balance;
    font-size: calc(var(--u) * 1.95 * var(--s));
    font-weight: 600;
    line-height: 1.32;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }
  /* Spanish: its own color and an orange rule, under the English */
  .es {
    text-wrap: balance;
    margin-top: calc(var(--u) * 0.9 * var(--s));
    font-size: calc(var(--u) * 1.7 * var(--s));
    font-weight: 600;
    line-height: 1.3;
    color: var(--es);
    border-left: calc(var(--u) * 0.28) solid var(--orange);
    padding-left: calc(var(--u) * 0.9);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }
  .body { margin-top: calc(var(--u) * 2 * var(--s)); }

  .item {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .item.in { opacity: 1; transform: none; }

  /* fade everything out on slide change */
  .content.exiting .rv,
  .content.exiting .item {
    opacity: 0 !important;
    transform: translateY(-20px) !important;
    transition: opacity 0.5s ease, transform 0.5s ease !important;
  }

  /* typed code terminal */
  .terminal {
    display: inline-block;
    max-width: calc(var(--u) * 54);
    background: rgba(0, 0, 0, 0.72);
    border: 1px solid rgba(0, 217, 255, 0.38);
    border-radius: calc(var(--u) * 0.55);
    padding: calc(var(--u) * 1.1 * var(--s)) calc(var(--u) * 1.6 * var(--s));
    font-family: var(--mono);
    font-size: calc(var(--u) * 1.32 * var(--s));
    line-height: 1.62;
    color: #e0f7ff;
    white-space: pre;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 217, 255, 0.1);
  }
  .terminal .cmt { color: #8f98ab; font-style: italic; }
  .terminal .cmt.hi { color: #dfe5f2; }
  .terminal .kw  { color: var(--cyan); }
  .terminal .fn  { color: var(--pink); }
  .terminal .str { color: var(--lime); }
  .terminal .num { color: var(--gold); }
  .terminal .ans { color: var(--lime); font-weight: 700; text-shadow: 0 0 10px rgba(182, 255, 112, 0.75); }
  .terminal .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--cyan);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: cursor-blink 1s steps(2, end) infinite;
    box-shadow: 0 0 8px var(--cyan);
  }
  @keyframes cursor-blink { 50% { opacity: 0; } }

  /* the trio: three lines at one size, in order, each with its Spanish */
  .trio .t { display: flex; align-items: flex-start; margin-bottom: calc(var(--u) * 1.7 * var(--s)); }
  .trio .t:last-child { margin-bottom: 0; }
  .trio .n {
    flex: none;
    width: calc(var(--u) * 3.4 * var(--s));
    padding-top: calc(var(--u) * 0.55 * var(--s));
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 1.25 * var(--s));
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 217, 255, 0.6);
  }
  .trio .en {
    font-family: var(--head);
    font-weight: 900;
    font-size: calc(var(--u) * 2.5 * var(--s));
    text-wrap: balance;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-shadow: -0.03em 0 0 rgba(255, 0, 60, 0.7), 0.03em 0 0 rgba(0, 217, 255, 0.7), 0 2px 12px rgba(0, 0, 0, 0.8);
  }
  .trio .es2 {
    margin-top: calc(var(--u) * 0.45 * var(--s));
    font-size: calc(var(--u) * 1.6 * var(--s));
    font-weight: 600;
    line-height: 1.3;
    color: var(--es);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }

  /* pioneer cards */
  .card {
    background: rgba(3, 8, 18, 0.7);
    border: 1px solid rgba(0, 217, 255, 0.25);
    border-left: calc(var(--u) * 0.32) solid var(--cyan);
    border-radius: calc(var(--u) * 0.5);
    padding: calc(var(--u) * 0.85 * var(--s)) calc(var(--u) * 1.4 * var(--s));
    margin-bottom: calc(var(--u) * 0.85 * var(--s));
  }
  .card:last-child { margin-bottom: 0; }
  .card .nm {
    font-family: var(--head);
    font-weight: 900;
    font-size: calc(var(--u) * 2.1 * var(--s));
    line-height: 1.1;
  }
  .card .en {
    text-wrap: balance;
    margin-top: calc(var(--u) * 0.3 * var(--s));
    font-size: calc(var(--u) * 1.42 * var(--s));
    font-weight: 500;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.95);
  }
  .card .es2 {
    text-wrap: balance;
    margin-top: calc(var(--u) * 0.25 * var(--s));
    font-size: calc(var(--u) * 1.28 * var(--s));
    font-weight: 600;
    line-height: 1.3;
    color: var(--es);
  }

  /* numbered rows: this year in class, and Mr. Johnston */
  .row {
    display: flex;
    align-items: flex-start;
    background: rgba(3, 8, 18, 0.62);
    border-left: calc(var(--u) * 0.28) solid var(--magenta);
    border-radius: calc(var(--u) * 0.45);
    padding: calc(var(--u) * 0.7 * var(--s)) calc(var(--u) * 1.2 * var(--s));
    margin-bottom: calc(var(--u) * 0.7 * var(--s));
  }
  .row:last-child { margin-bottom: 0; }
  .row .ix {
    flex: none;
    width: calc(var(--u) * 3 * var(--s));
    padding-top: calc(var(--u) * 0.25 * var(--s));
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 1.2 * var(--s));
    color: var(--cyan);
  }
  .row .en { font-size: calc(var(--u) * 1.55 * var(--s)); font-weight: 700; line-height: 1.28; text-wrap: balance; }
  .row .es2 {
    text-wrap: balance;
    margin-top: calc(var(--u) * 0.2 * var(--s));
    font-size: calc(var(--u) * 1.3 * var(--s));
    font-weight: 600;
    line-height: 1.28;
    color: var(--es);
  }
  .row.bio { border-left-color: var(--cyan); }
  .row.soft {
    border: 1px solid rgba(0, 217, 255, 0.45);
    border-left: calc(var(--u) * 0.28) solid var(--lime);
    background: rgba(0, 28, 44, 0.72);
  }

  /* the planned pathway: year 1 solid and bold, years 2-4 lighter */
  .step {
    display: flex;
    align-items: center;
    border: 2px dashed rgba(255, 255, 255, 0.28);
    border-radius: calc(var(--u) * 0.5);
    background: rgba(3, 8, 18, 0.5);
    padding: calc(var(--u) * 0.65 * var(--s)) calc(var(--u) * 1.2 * var(--s));
    margin-bottom: calc(var(--u) * 0.65 * var(--s));
  }
  .step .yr {
    flex: none;
    width: calc(var(--u) * 5.4 * var(--s));
    font-family: var(--head);
    font-weight: 900;
    font-size: calc(var(--u) * 2.6 * var(--s));
    line-height: 1;
    color: rgba(255, 255, 255, 0.42);
  }
  .step .yr small {
    display: block;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.3em;
    line-height: 1.15;
    letter-spacing: 0.08em;
  }
  .step .yr small + small { margin-bottom: 0.2em; }
  .step .tag {
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 1.0 * var(--s));
    letter-spacing: calc(var(--u) * 0.14);
    color: rgba(255, 255, 255, 0.58);
  }
  .step .course {
    text-wrap: balance;
    font-size: calc(var(--u) * 1.6 * var(--s));
    font-weight: 500;
    line-height: 1.25;
    color: rgba(255, 255, 255, 0.68);
  }
  .step .where {
    margin-top: 0.25em;
    font-size: calc(var(--u) * 1.25 * var(--s));
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.8);
  }
  .step.start {
    border: 3px solid var(--cyan);
    background: rgba(0, 40, 64, 0.78);
    box-shadow: 0 0 calc(var(--u) * 1.4) rgba(0, 217, 255, 0.35);
  }
  .step.start .yr { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 217, 255, 0.6); }
  .step.start .tag { color: var(--lime); }
  .step.start .course {
    font-family: var(--head);
    font-weight: 900;
    font-size: calc(var(--u) * 2.0 * var(--s));
    line-height: 1.15;
    color: #fff;
  }
  .note { margin-top: calc(var(--u) * 1.0 * var(--s)); }
  .note .en { font-size: calc(var(--u) * 1.35 * var(--s)); font-weight: 600; line-height: 1.3; text-wrap: balance; }
  .note .es2 {
    text-wrap: balance;
    margin-top: 0.2em;
    font-size: calc(var(--u) * 1.2 * var(--s));
    font-weight: 600;
    line-height: 1.3;
    color: var(--es);
  }

  /* chips: fields, course facts, AP courses */
  .chips-head {
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 1.05 * var(--s));
    letter-spacing: calc(var(--u) * 0.14);
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: calc(var(--u) * 0.6 * var(--s));
  }
  .chips { display: flex; flex-wrap: wrap; margin: calc(var(--u) * -0.35 * var(--s)); }
  .chip {
    margin: calc(var(--u) * 0.35 * var(--s));
    border: 2px solid rgba(0, 217, 255, 0.55);
    border-radius: calc(var(--u) * 0.5);
    background: rgba(3, 8, 18, 0.66);
    padding: calc(var(--u) * 0.55 * var(--s)) calc(var(--u) * 1.0 * var(--s));
  }
  .chip .en { font-size: calc(var(--u) * 1.45 * var(--s)); font-weight: 800; line-height: 1.2; }
  .chip .es2 {
    margin-top: 0.1em;
    font-size: calc(var(--u) * 1.12 * var(--s));
    font-weight: 600;
    line-height: 1.25;
    color: var(--es);
  }
  .chip .tag {
    margin-top: 0.3em;
    font-family: var(--mono);
    font-weight: 700;
    font-size: calc(var(--u) * 0.95 * var(--s));
    letter-spacing: calc(var(--u) * 0.12);
    color: rgba(255, 255, 255, 0.62);
  }
  .chip.planned { border-style: dashed; border-color: rgba(255, 255, 255, 0.45); }
  .chip.planned .en { font-weight: 700; color: rgba(255, 255, 255, 0.9); }
  /* small print (the cyber line: small type, never a headline) */

  var qrRow = h('div', 'cta-row item');
  var qrTile = h('div', 'qr-tile');
  qrTile.appendChild(makeImg(QR_SRC, 'qr', 'QR code for the interest form', function () {
    qrRow.classList.add('noqr');
  }));
  qrRow.appendChild(qrTile);
  var qrCap = h('div', 'qr-cap');
  qrCap.appendChild(h('div', 'en fallback', 'Scan the QR code at our table.'));
  qrCap.appendChild(h('div', 'es2 fallback', 'Escanea el código QR en nuestra mesa.', 'es'));
  var reg = h('div', 'en');
  reg.appendChild(document.createTextNode('This isn’t registration: ask for '));
  reg.appendChild(h('b', null, 'Fundamentals of Computer Science'));
  reg.appendChild(document.createTextNode(' at course selection.'));
  qrCap.appendChild(reg);
  qrCap.appendChild(h('div', 'es2', 'No es la inscripción: pide Fundamentals of Computer Science al elegir tus materias.', 'es'));
  qrRow.appendChild(qrCap);
  els.parking.appendChild(qrRow);
  function parkQr() {
    qrRow.classList.remove('in');
    if (qrRow.parentNode !== els.parking) els.parking.appendChild(qrRow);
  }

  // dots
  slides.forEach(function () { els.dots.appendChild(h('div', 'dot')); });
  var dotEls = Array.prototype.slice.call(els.dots.children);
  function updateDots(i) { dotEls.forEach(function (d, k) { d.classList.toggle('active', k === i); }); }

  // footer ask: English and Spanish take turns, one per slide
  function setFooter(i) {
    els.ctaEn.classList.toggle('on', i % 2 === 0);
    els.ctaEs.classList.toggle('on', i % 2 === 1);
  }

  // ───── building a slide ─────
  function setLine(el, text) {
    el.textContent = text || '';
    el.style.display = text ? '' : 'none';
  }

  function build(s) {
    parkQr();
    els.eyebrow.textContent = s.eyebrow || '';

    els.headline.textContent = '';
    els.headline.className = 'headline rv ' + (s.size || 'l');
    if (s.head) {
      s.head.forEach(function (line) {
        var o = typeof line === 'string' ? { t: line } : line;
        els.headline.appendChild(h('span', 'ln' + (o.accent ? ' accent' : '') + (o.small ? ' small' : ''), o.t));
      });
      els.headline.style.display = '';
    } else {
      els.headline.style.display = 'none';
    }
    setLine(els.sub, s.sub);
    setLine(els.es, s.es);

    els.body.textContent = '';
    var items = [], term = null;

    if (s.trio) {
      var trio = h('div', 'trio');
      s.trio.forEach(function (t, k) {
        var row = h('div', 't item');
        row.appendChild(h('div', 'n', '0' + (k + 1)));
        var tx = h('div', 'tx');
        tx.appendChild(h('div', 'en', t.en));
        tx.appendChild(h('div', 'es2', t.es, 'es'));
        row.appendChild(tx);
        trio.appendChild(row);
        items.push(row);
      });
      els.body.appendChild(trio);
    }
    if (s.code) {
      term = buildTerminal(s);
      els.body.appendChild(term.el);
    }
    if (s.cards) {
      s.cards.forEach(function (c) {
        var card = h('div', 'card item');
        card.appendChild(h('div', 'nm', c.nm));
        card.appendChild(h('div', 'en', c.en));
        card.appendChild(h('div', 'es2', c.es, 'es'));
        els.body.appendChild(card);
        items.push(card);
      });
    }
    if (s.rows || s.bio) {
      (s.rows || s.bio).forEach(function (r, k) {
        var row = h('div', 'row item' + (s.bio ? ' bio' : '') + (r.soft ? ' soft' : ''));
        row.appendChild(h('div', 'ix', (k < 9 ? '0' : '') + (k + 1)));
        row.appendChild(pair('tx', r.en, r.es));
        els.body.appendChild(row);
        items.push(row);
      });
    }
    if (s.path) {
      s.path.forEach(function (p) {
        var step = h('div', 'step item' + (p.start ? ' start' : ''));
        var yr = h('div', 'yr');
        yr.appendChild(h('small', null, 'YEAR'));
        yr.appendChild(h('small', null, 'AÑO', 'es'));
        yr.appendChild(document.createTextNode(p.yr));
        step.appendChild(yr);
        var info = h('div', 'info');
        info.appendChild(h('div', 'tag', p.tag));
        info.appendChild(h('div', 'course', p.course));
        if (p.where) info.appendChild(h('div', 'where', p.where));
        step.appendChild(info);
        els.body.appendChild(step);
        items.push(step);
      });
    }
    if (s.note) {
      var note = pair('note item', s.note.en, s.note.es);
      els.body.appendChild(note);
      items.push(note);
    }
    if (s.chipsHead) {
      var ch = h('div', 'chips-head item', s.chipsHead);
      els.body.appendChild(ch);
      items.push(ch);
    }
    if (s.chips) {
      var chips = h('div', 'chips');
      s.chips.forEach(function (c) {
        var chip = h('div', 'chip item' + (c.planned ? ' planned' : ''));
        chip.appendChild(h('div', 'en', c.en));
        if (c.es) chip.appendChild(h('div', 'es2', c.es, 'es'));
        if (c.tag) chip.appendChild(h('div', 'tag', c.tag));
        chips.appendChild(chip);
        items.push(chip);
      });
      els.body.appendChild(chips);
    }
    if (s.fine) {
      var fine = pair('fine item', s.fine.en, s.fine.es);
      els.body.appendChild(fine);
      items.push(fine);
    }
    if (s.cta) {
      els.body.appendChild(qrRow);
      items.push(qrRow);
    }
    els.body.style.display = els.body.firstChild ? '' : 'none';
    return { items: items, term: term };
  }

  // ───── the typed terminal ─────
  function buildTerminal(s) {
    var el = h('div', 'terminal');
    var segs = s.code.concat(s.reveal ? s.reveal.code : []);
    var spans = segs.map(function (seg) {
      var sp = h('span', seg[1] || '');
      el.appendChild(sp);
      return sp;
    });
    el.appendChild(h('span', 'cursor'));
    var spot = -1;
    s.code.forEach(function (seg, k) { if (seg[2]) spot = k; });
    return { el: el, segs: segs, spans: spans, first: s.code.length, spot: spot };
  }
  function fillTerminal(term, s) {          // the finished text, answer shown
    term.segs.forEach(function (seg, k) { term.spans[k].textContent = seg[0]; });
    if (s.reveal && term.spot >= 0) {
      term.spans[term.spot].textContent = s.reveal.swap;
      term.spans[term.spot].className = s.reveal.swapClass || '';
    }
  }
  function clearTerminal(term) {
    term.segs.forEach(function (seg, k) {
      term.spans[k].textContent = '';
      term.spans[k].className = seg[1] || '';
    });
  }
  function chars(segs) { return segs.reduce(function (n, seg) { return n + seg[0].length; }, 0); }

  // Typewriter, driven by requestAnimationFrame so the DOM changes at most once per frame.
  function typeSegments(term, from, to, charDelay) {
    var segs = term.segs.slice(from, to), spans = term.spans.slice(from, to);
    var total = chars(segs), start = performance.now(), last = -1;
    return new Promise(function (resolve) {
      function frame(now) {
        var shown = Math.min(total, Math.floor((now - start) / charDelay));
        if (shown !== last) {
          last = shown;
          var rest = shown;
          for (var k = 0; k < segs.length; k++) {
            var t = segs[k][0];
            var target = rest >= t.length ? t : t.slice(0, rest);
            if (spans[k].textContent !== target) spans[k].textContent = target;
            rest = Math.max(0, rest - t.length);
          }
        }
        if (shown >= total) resolve();
        else requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }
  function typeText(el, text, charDelay) {
    var start = performance.now();
    el.textContent = '';
    function frame(now) {
      var n = Math.min(text.length, Math.floor((now - start) / charDelay));
      el.textContent = text.slice(0, n);
      if (n < text.length) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ───── fit: center between HUD and footer, shrink until nothing overflows ─────
  function overX(el) { return el.offsetParent !== null && el.scrollWidth > el.clientWidth + 1; }
  function anyOverX() {
    var list = els.content.querySelectorAll('.headline, .terminal, .trio .en, .card .nm, .chip, .step, .row');
    for (var k = 0; k < list.length; k++) if (overX(list[k])) return true;
    return false;
  }
  function fit(s, built, finished) {
    var c = els.content;
    var hudBottom = els.hud.getBoundingClientRect().bottom;
    var footTop = els.footer.getBoundingClientRect().top;
    var pad = window.innerHeight * 0.025;
    var room = footTop - hudBottom - 2 * pad;
    c.style.top = ((hudBottom + footTop) / 2) + 'px';
    var term = built.term;
    if (term) {
      term.el.style.minWidth = '';
      term.el.style.minHeight = '';
      fillTerminal(term, s);             // measure the finished terminal
    }
    var hs = 1, sc = 1, k;
    c.style.setProperty('--hs', '1');
    c.style.setProperty('--s', '1');
    for (k = 0; k < 40 && overX(els.headline); k++) {
      hs *= 0.95;
      c.style.setProperty('--hs', hs.toFixed(4));
    }
    for (k = 0; k < 40 && (c.offsetHeight > room || anyOverX()); k++) {
      sc *= 0.95;
      c.style.setProperty('--s', sc.toFixed(4));
    }
    if (term) {                          // hold the terminal at its final size so nothing jumps while typing
      term.el.style.minWidth = Math.ceil(term.el.offsetWidth) + 'px';
      term.el.style.minHeight = Math.ceil(term.el.offsetHeight) + 'px';
      if (!finished) clearTerminal(term);
    }
  }

  // ───── art ─────
  var currentArt = null;
  function showArt(s) {
    var a = artEls[s.art];
    if (!a) return;
    if (!ART[s.art].emblem) a.img.style.objectPosition = s.pos || '50% 30%';
    if (currentArt && currentArt !== a) currentArt.layer.classList.remove('active');
    a.layer.classList.add('active');
    currentArt = a;
  }
  function flashGlitch() {
    els.glitch.classList.remove('flash');
    void els.glitch.offsetWidth;
    els.glitch.classList.add('flash');
  }

  // ───── progress bar ─────
  var EXIT_MS = 700;
  function startProgress(ms) {
    els.bar.style.transition = 'none';
    els.bar.style.transform = 'scaleX(0)';
    void els.bar.offsetWidth;
    els.bar.style.transition = 'transform ' + ms + 'ms linear';
    els.bar.style.transform = 'scaleX(1)';
  }
  function drainProgress() {
    els.bar.style.transition = 'transform ' + EXIT_MS + 'ms ease-in';
    els.bar.style.transform = 'scaleX(0)';
  }

  // ───── one slide, live ─────
  var TYPE_MS = 28, STAGGER_MS = 420, HOLD_MS = 5200, SETTLE_MS = 250;
  var reveals = [els.eyebrow, els.headline, els.sub, els.es, els.body];
  // Each part comes in after its wait; parts a slide doesn't have are skipped.
  var STEPS = [[els.eyebrow, 400], [els.headline, 350], [els.sub, 450], [els.es, 400], [els.body, 400]];
  function introPlan() {
    return STEPS.filter(function (st) { return st[0] === els.eyebrow || st[0].style.display !== 'none'; });
  }

  async function runSlide(i) {
    var s = slides[i];
    updateDots(i);
    setFooter(i);
    flashGlitch();
    showArt(s);
    var built = build(s);
    fit(s, built, false);

    var eyebrowText = els.eyebrow.textContent;
    els.eyebrow.textContent = '';
    var bodyMs = built.items.length * STAGGER_MS;
    if (built.term) {
      bodyMs += chars(s.code) * TYPE_MS;
      if (s.reveal) bodyMs += s.reveal.wait + chars(s.reveal.code) * TYPE_MS;
    }
    var hold = s.hold || HOLD_MS;
    var plan = introPlan();
    var introMs = plan.reduce(function (n, st) { return n + st[1]; }, SETTLE_MS);
    startProgress(introMs + bodyMs + hold);

    for (var p = 0; p < plan.length; p++) {
      await sleep(plan[p][1]);
      plan[p][0].classList.add('in');
      if (plan[p][0] === els.eyebrow) typeText(els.eyebrow, eyebrowText, 18);
    }
    await sleep(SETTLE_MS);

    if (built.term) {
      await typeSegments(built.term, 0, built.term.first, TYPE_MS);
      if (s.reveal) {
        await sleep(s.reveal.wait);
        var spot = built.term.spans[built.term.spot];
        spot.textContent = s.reveal.swap;
        spot.className = s.reveal.swapClass || '';
        await typeSegments(built.term, built.term.first, built.term.segs.length, TYPE_MS);
      }
    }
    for (var k = 0; k < built.items.length; k++) {
      built.items[k].classList.add('in');
      await sleep(STAGGER_MS);
    }
    await sleep(hold);

    drainProgress();
    els.content.classList.add('exiting');
    await sleep(EXIT_MS);
    els.content.classList.remove('exiting');
    reveals.forEach(function (el) { el.classList.remove('in'); });
  }

  // ───── one slide, finished (?preview=N) ─────
  function renderFinished(i) {
    var s = slides[i];
    updateDots(i);
    setFooter(i);
    showArt(s);
    var built = build(s);
    fit(s, built, true);
    reveals.forEach(function (el) { el.classList.add('in'); });
    built.items.forEach(function (el) { el.classList.add('in'); });
    els.bar.style.transform = 'scaleX(1)';
  }

  // ───── the loop ─────
  async function loop() {
    var i = START;
    var reloadAt = RELOAD_MIN > 0 ? Date.now() + RELOAD_MIN * 60000 : Infinity;
    while (true) {
      try {
        await runSlide(i);
      } catch (err) {
        errors.push('slide ' + (i + 1) + ': ' + err);
        els.content.classList.remove('exiting');
        reveals.forEach(function (el) { el.classList.remove('in'); });
        await sleep(1500);
      }
      i = (i + 1) % slides.length;
      // Only with ?reload=M, and only between cycles, never mid-slide.
      if (i === START && Date.now() >= reloadAt) { location.reload(); return; }
    }
  }

  // ───── clock ─────
  function updateClock() {
    var d = new Date();
    els.clock.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ───── fullscreen prompt ─────
  function enterFullscreen() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    els.prompt.classList.add('hidden');
  }
  function setupPrompt() {
    els.prompt.addEventListener('click', enterFullscreen);
    els.prompt.classList.remove('hidden');
    setTimeout(function () { els.prompt.classList.add('hidden'); }, 8000);
    var timer = null;
    document.addEventListener('mousemove', function () {
      els.prompt.classList.remove('hidden');
      clearTimeout(timer);
      timer = setTimeout(function () { els.prompt.classList.add('hidden'); }, 5000);
    });
  }

  // ───── wait for every image, then go ─────
  function whenImagesReady(limitMs) {
    var done = 0;
    function count() { els.bootCount.textContent = done + ' / ' + allImages.length; }
    count();
    var all = Promise.all(allImages.map(function (img) {
      return img.ready.then(function () { done++; count(); });
    }));
    return Promise.race([all, sleep(limitMs)]);   // never sit on a black screen forever
  }

  updateClock();
  if (PREVIEW >= 0) {
    document.body.classList.add('preview');
    els.boot.hidden = true;
    renderFinished(PREVIEW);
    window.addEventListener('resize', function () { renderFinished(PREVIEW); });
  } else {
    setInterval(updateClock, 30000);
    setupPrompt();
    whenImagesReady(45000).then(function () {
      els.boot.classList.add('done');
      loop();
    });
  }
})();
</script>

</body>
</html>
